[project]
name = "tnnt-repo-scout"
version = "0.1.0"
description = "Finds new GitHub repos and judges them by tool type with TypeSafe Jev, using The Next New Thing repo index as the bar."
requires-python = ">=3.10"
dependencies = ["typesafe-sdk==0.7.5"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 180
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E402"]
